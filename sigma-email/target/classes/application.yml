spring:
  freemarker:
    template-loader-path: classpath:/templates/
    cache: false
    charset: UTF-8
    check-template-location: true
    content-type: text/html
    expose-request-attributes: false
    expose-session-attributes: false
    request-context-attribute: request
    #后缀，.jsp ok
    suffix: .ftl
view:
  path: views/emailVerify.ftl

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.sigma.email.kafka"

sigma:
  email:
    kafka:
      topic: ${SIGMA_EMAIL_KAFKA_TOPIC:email-send}
      group-id: ${SIGMA_EMAIL_KAFKA_GROUP_ID:sigma-email-group}
  gmail:
    credentials-path: classpath:credentials.json
    tokens-dir: ${GMAIL_TOKENS_DIR:/tmp/sigma-gmail-tokens}
    target-email: ${GMAIL_TARGET_EMAIL:your@gmail.com}
    storage-dir: ${GMAIL_STORAGE_DIR:/tmp/sigma-gmail-emails}
    fetch-interval-ms: ${GMAIL_FETCH_INTERVAL_MS:300000}